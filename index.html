<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KUBIKA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            /* Background dari assets/images */
            background-image: url('assets/images/bgkubika3.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Overlay agar teks & card tetap terbaca */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.75); /* Putih transparan agar terang */
            z-index: 1;
        }

        .login-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 360px;
            padding: 35px 30px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border: 3px solid #f59e0b;
            min-height: 480px;
        }

        .logo-container img {
            width: 190px;
            margin-bottom: 12px;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.1));
        }

        h1 {
            color: #b91c1c;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: 2px;
        }

        p {
            color: #475569;
            font-size: 15px;
            margin-bottom: 30px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 15px;
            background-color: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            color: #1e2937;
            margin-bottom: 20px;
            outline: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
        }

        input::placeholder, select:invalid {
            color: #94a3b8;
        }

        select option {
            background-color: white;
            color: #1e2937;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #f59e0b, #ea580c);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="assets/images/Kubika.png" alt="Logo KUBIKA">
        </div>

        <h1>KUBIKA</h1>
        <p>Kreasi Unggul Bangun Ruang Kubus dan Tabung</p>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Nama Pengguna" required>
            
            <select id="deviceType" required>
                <option value="" disabled selected>Pilih Perangkat</option>
                <option value="hp">Handphone (HP)</option>
                <option value="laptop">Laptop / PC</option>
            </select>

            <button type="submit">Masuk Sekarang</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('username').value;
            const device = document.getElementById('deviceType').value;
            localStorage.setItem('userName', name);
            
            if (device === 'hp') {
                window.location.href = 'dashboardhp.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>

</body>
</html>
