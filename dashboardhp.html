<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | KUBIKA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * { font-family: 'Segoe UI', sans-serif; }

        body {
            margin: 0;
            background: 
                linear-gradient(rgba(10, 15, 30, 0.45), rgba(10, 15, 30, 0.55)), 
                url('assets/images/bgkubika4.png') center/cover no-repeat fixed;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR ATAS */
        .navbar {
            padding: 12px 20px;
            background: rgba(10, 15, 30, 0.4); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); 
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 38px; 
            height: auto;
        }

        .brand-text {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        /* USER PROFILE DROPDOWN */
        .user-profile {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            transition: 0.3s;
        }

        .user-profile:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .dropdown-toggle::after { display: none; }

        .dropdown-menu {
            background: #162447;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 0;
            min-width: 180px;
            margin-top: 10px !important;
        }

        .dropdown-item {
            padding: 12px 20px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .dropdown-item.greeting {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: default;
            font-weight: 600;
        }

        .dropdown-item.greeting:hover {
            background: transparent;
            color: #cbd5e1;
        }

        .dropdown-item.logout {
            color: #ff4d4d;
            font-weight: 600;
        }

        .dropdown-item.logout:hover {
            background: rgba(255, 77, 77, 0.1);
            color: #ff4d4d;
        }

        /* HERO CONTENT LAYOUT */
        .hero-section {
            padding: 25px 20px 25px 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* LOGO UTAMA DI TENGAH */
        .center-logo {
            width: 140px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.35)); 
        }

        .hello-tag {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .hello-tag span {
            color: #FFB800;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        /* GRID MENU 2 KOLOM SEJAJAR (BALOK & TABUNG) */
        .card-container {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr); 
            align-items: stretch; 
            gap: 15px; 
            padding: 0 5px;
            width: 100%;
            max-width: 440px;
            margin-bottom: 35px;
        }

        .card-link {
            text-decoration: none;
            color: inherit;
        }

        .edu-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 25px 12px;
            width: 100% !important;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .edu-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #FFB800;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .icon-box {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin: 0 auto 12px auto;
        }

        .blue-icon { background: #00bfff; color: white; box-shadow: 0 4px 10px rgba(0, 191, 255, 0.3); }
        .teal-icon { background: #f51f0b; color: #ffffff; box-shadow: 0 4px 10px rgba(0, 250, 154, 0.3); font-weight: bold; }

        .edu-card h3 { font-size: 1.25rem; font-weight: 800; margin-bottom: 6px; color: white; }
        
        .edu-card p {
            font-size: 0.75rem; 
            color: rgba(255, 255, 255, 0.7); 
            margin: 0;
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.3;
        }

        /* TUTOR BUTTON AREA */
        .tutor-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
            padding: 0 5px;
            margin-bottom: 15px;
        }

        .tutor-btn {
            background: transparent;
            border: 2px solid rgba(255, 184, 0, 0.6);
            color: #FFB800;
            padding: 11px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .tutor-btn:hover {
            background: #FFB800;
            color: #111827;
            box-shadow: 0 0 15px rgba(255, 184, 0, 0.4);
            text-decoration: none;
        }

        /* Perbaikan Footer */
        .custom-footer {
            width: 100%; 
            text-align: center; 
            color: rgba(255, 255, 255, 0.7); 
            font-size: 0.8rem; 
            letter-spacing: 0.5px;
            padding: 15px 10px;
            background: rgba(10, 15, 30, 0.5); 
            backdrop-filter: blur(5px);         
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: auto; /* Memaksa footer ke paling bawah jika konten sedikit */
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container-fluid p-0 d-flex justify-content-between align-items-center">
            <div class="brand-area">
                <img src="assets/images/kubika.png" alt="Logo KUBIKA" class="logo-img">
                <span class="brand-text">KUBIKA</span>
            </div>
            
            <div class="dropdown">
                <button class="user-profile dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fa-solid fa-user"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><span class="dropdown-item greeting" id="popName">Halo, Student</span></li>
                    <li><a class="dropdown-item logout" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="hero-section">
        <img src="assets/images/Kubika2.png" alt="Logo Utama KUBIKA" class="center-logo">

        <div class="hello-tag">Halo, <span id="studentName">Student</span>!</div>
        <h1>WELCOME TO KUBIKA</h1>

        <div class="card-container">
            <a href="balookhp.html" class="card-link">
                <div class="card edu-card">
                    <div class="icon-box blue-icon"><i class="fa-solid fa-cube"></i></div>
                    <h3>Balok</h3>
                    <p>Rusuk • Volume • Jaring</p>
                </div>
            </a>

            <a href="tabuunghp.html" class="card-link">
                <div class="card edu-card">
                    <div class="icon-box teal-icon"><i class="fa-solid fa-database"></i></div>
                    <h3>Tabung</h3>
                    <p>Selimut • Luas • Volume</p>
                </div>
            </a>
        </div>

        <div class="tutor-grid">
            <a href="tutor-pakailp.html" class="tutor-btn">
                <i class="fas fa-circle-info"></i> Tutorial Penggunaan Media
            </a>
        </div>
    </main>

    <footer class="custom-footer">
        Developed by <strong>DEVI</strong>, <strong>NURBAITY</strong> & <strong>AZIZAH NURFAUZIAH</strong> | <strong>FMIPA UNM</strong>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const activeUser = localStorage.getItem('userName');
            if (activeUser && activeUser.trim() !== "") {
                document.getElementById('studentName').innerText = activeUser;
                document.getElementById('popName').innerText = 'Halo, ' + activeUser;
            } else {
                window.location.replace('index.html'); 
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.clear(); 
            window.location.replace('index.html'); 
        });
    </script>
</body>
</html>
