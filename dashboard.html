<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | KUBIKA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * { font-family: 'Segoe UI', sans-serif; }

        body {
            margin: 0;
            background: 
                linear-gradient(rgba(10, 15, 30, 0.35), rgba(10, 15, 30, 0.45)), 
                url('assets/images/bgkubika3.png') center/cover no-repeat fixed;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* NAVBAR ATAS */
        .navbar {
            padding: 12px 50px; 
            background: rgba(10, 15, 30, 0.4); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); 
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-nav {
            width: 38px; 
            height: auto;
        }

        .brand-text {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        /* DROPDOWN PROFIL */
        .user-profile {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            transition: 0.3s;
        }

        .user-profile:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .dropdown-toggle::after {
            display: none;
        }

        .dropdown-menu {
            background: #162447; 
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 0;
            min-width: 180px;
            margin-top: 10px !important;
        }

        .dropdown-item {
            padding: 10px 18px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .dropdown-item.greeting {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: default;
            font-weight: 600;
        }

        .dropdown-item.greeting:hover {
            background: transparent;
            color: #cbd5e1;
        }

        .dropdown-item.logout {
            color: #ff4d4d;
            font-weight: 600;
        }

        .dropdown-item.logout:hover {
            background: rgba(255, 77, 77, 0.1);
            color: #ff4d4d;
        }

        /* HERO CONTENT */
        .hero-section {
            padding: 20px 20px 40px 20px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
        }

        /* LOGO UTAMA DI TENGAH */
        .center-logo {
            width: 90px; 
            height: auto;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.3)); 
        }

        /* TULISAN SAPAAN NAMA SISWA */
        .hello-tag {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .hello-tag span {
            color: #ff3700; 
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 20px; 
            letter-spacing: -0.5px;
        }

        /* CARDS MENU */
        .card-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px; 
        }

        .card-link {
            text-decoration: none;
            color: inherit;
        }

        .edu-card {
            background: rgba(15, 23, 42, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 18px;
            padding: 20px 15px; 
            width: 220px; 
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .edu-card:hover {
            background: rgba(255, 255, 255, 0.1); 
            transform: translateY(-5px);
            border-color: #FFB800; 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4), 0 0 12px rgba(255, 184, 0, 0.2);
        }

        .icon-box {
            width: 48px; 
            height: 48px; 
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin: 0 auto 12px auto;
        }

        .blue-icon { background: #00bfff; color: white; box-shadow: 0 4px 12px rgba(0, 191, 255, 0.4); }

        .edu-card h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; color: white; }
        .edu-card p { font-size: 0.8rem; color: rgba(255, 255, 255, 0.75); margin: 0; }

        /* TOMBOL TUTORIAL BAWAH */
        .tutor-grid {
            display: flex;
            justify-content: center;
            margin-top: 5px;
        }

        .tutor-btn {
            background: transparent; 
            border: 2px solid rgba(255, 184, 0, 0.7); 
            color: #ff6a00;
            padding: 8px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tutor-btn:hover {
            background: #e7e1df;
            color: #0c1020;
            border-color: #FFB800;
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(255, 184, 0, 0.5);
            text-decoration: none;
        }

        /* FOOTER */
        footer {
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            padding: 12px 0;
            background: rgba(10, 33, 99, 0.826);
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(27, 13, 229, 0.1);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .navbar { padding: 12px 20px; }
            .hero-section { padding: 15px; }
            .center-logo { width: 80px; } 
            h1 { font-size: 1.8rem; margin-bottom: 15px; }
            .hello-tag { font-size: 1.1rem; }
            .card-container { flex-direction: column; align-items: center; gap: 12px; }
            .edu-card { width: 100%; max-width: 240px; padding: 18px; }
            .tutor-btn { width: 100%; max-width: 240px; justify-content: center; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container-fluid p-0 d-flex justify-content-between align-items-center">
            <div class="brand-area">
                <img src="assets/images/kubika4.png" alt="Logo KUBIKA" class="logo-nav">
                <span class="brand-text">KUBIKA</span>
            </div>

            <div class="dropdown">
                <button class="user-profile dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fa-solid fa-user"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><span class="dropdown-item greeting" id="popName">Haloo, Student</span></li>
                    <li><a class="dropdown-item logout" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="hero-section">
        <img src="assets/images/kubika.png" alt="Logo Utama KUBIKA" class="center-logo">
        
        <div class="hello-tag">Halo, <span id="studentName">Student</span>!</div>
        
        <h1>WELCOME TO KUBIKA</h1>

        <div class="card-container">
            <a href="baloklp.html" class="card-link">
                <div class="card edu-card">
                    <div class="icon-box blue-icon"><i class="fa-solid fa-cube"></i></div>
                    <h3>Balok</h3>
                    <p>Rusuk • Volume • Jaring</p>
                </div>
            </a>

            <a href="tabuunglp.html" class="card-link">
                <div class="card edu-card">
                    <div class="icon-box" style="background:#f51f0b; color:white; box-shadow:0 4px 12px rgba(245,31,11,0.4);">
                        <i class="fa-solid fa-database"></i>
                    </div>
                    <h3>Tabung</h3>
                    <p>Volume • Luas • Jaring Tabung</p>
                </div>
            </a>
        </div>

        <div class="tutor-grid">
            <a href="tutor-pakailp.html" class="tutor-btn">
                <i class="fas fa-circle-info"></i>
                Tutorial Penggunaan Media
            </a>
        </div>
    </main>

    <footer>
        Developed by <strong>DEVI</strong>, <strong>NURBAITY</strong> & <strong>AZIZAH NURFAUZIAH</strong> | <strong>FMIPA UNM</strong>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const activeUser = localStorage.getItem('userName');
            
            if (activeUser && activeUser.trim() !== "") {
                document.getElementById('studentName').innerText = activeUser;
                document.getElementById('popName').innerText = 'Haloo, ' + activeUser;
            } else {
                window.location.replace('index.html'); 
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.clear(); 
            window.location.replace('index.html'); 
        });
    </script>
</body>
</html>
